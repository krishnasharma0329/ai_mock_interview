<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Admin · Mock Interviewer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin">
  <header class="site-header">
    <div class="wrap admin-wrap header-inner">
      <div class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></span>
        Mock Interviewer <span class="admin-tag">Admin</span>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost btn-sm hidden" id="refreshBtn">Refresh</button>
        <button class="btn btn-ghost btn-sm hidden" id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap admin-wrap">
    <section id="login" class="card login-card">
      <h2>Admin sign in</h2>
      <p class="sub">Enter the admin password to view saved interviews.</p>
      <form id="loginForm">
        <div class="field">
          <label for="pw">Password</label>
          <input id="pw" type="password" class="input" autocomplete="current-password" />
        </div>
        <div id="loginErr" class="error hidden"></div>
        <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
      </form>
    </section>

    <section id="dash" class="hidden">
      <div class="stats-row">
        <div class="card stat-card"><small>Total interviews</small><b id="stTotal">0</b></div>
        <div class="card stat-card"><small>Completed</small><b id="stDone">0</b></div>
        <div class="card stat-card"><small>Average score</small><b id="stAvg">—</b></div>
        <div class="card stat-card"><small>Likely selected (≥ 60%)</small><b id="stSel">0</b></div>
      </div>

      <div class="card list-card">
        <div class="list-head">
          <h2>Candidates</h2>
          <input id="search" class="input" placeholder="Search name, company or role…" />
        </div>
        <div class="table-wrap">
          <table class="itable">
            <thead><tr><th></th><th>Candidate</th><th>Interview</th><th>Date</th><th>Status</th><th>Score</th><th>Verdict</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <p id="empty" class="muted center hidden" style="padding:30px 0">No interviews saved yet.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="detail" class="detail hidden" role="dialog" aria-modal="true">
    <div class="detail-panel">
      <div class="detail-head">
        <b id="dTitle">Interview</b>
        <div class="header-actions">
          <button class="btn btn-ghost btn-sm" id="deleteBtn">Delete</button>
          <button class="btn btn-ghost btn-sm" id="closeDetail">Close</button>
        </div>
      </div>
      <div class="detail-body" id="dBody"></div>
    </div>
  </div>

  <script src="admin.js" type="module"></script>
</body>
</html>
